version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: smart-leads-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  server:
    build: ./server
    container_name: smart-leads-server
    ports:
      - '5000:5000'
    environment:
      - MONGODB_URI=mongodb://mongo:27017/smart-leads
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - app-network

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api
    container_name: smart-leads-client
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
